<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Ulang Tahun</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(45deg,#ff6ec4,#7873f5);
font-family:Arial;
overflow:hidden;
}

.card{
width:320px;
height:220px;
background:white;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
position:relative;
animation:float 3s infinite ease-in-out;
cursor:pointer;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}

.content{
display:none;
flex-direction:column;
}

input[type="checkbox"]{
display:none;
}

input[type="checkbox"]:checked + .card .awal{
display:none;
}

input[type="checkbox"]:checked + .card .content{
display:flex;
}

textarea,input[type="text"]{
margin:5px 0;
padding:8px;
border-radius:8px;
border:1px solid #ccc;
width:100%;
}

img{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}
</style>
</head>
<body>

<label>
<input type="checkbox">
<div class="card">

<div class="awal">
<h3>Klik Untuk Buka 🎉</h3>
</div>

<div class="content">
<img src="https://i.imgur.com/4AiXzf8.jpeg">
<h3>Selamat Ulang Tahun 🎂</h3>
<p>Semoga panjang umur, sehat selalu, rezeki lancar dan impian tercapai!</p>
<input type="text" placeholder="Nama pengirim">
<textarea placeholder="Tulis ucapan tambahan..."></textarea>
</div>

</div>
</label>

</body>
</html>
